<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10051f" />
  <meta name="description" content="Leandro Orellana's software development portfolio, focused on mobile apps, backend systems, and artificial intelligence." />
  <title>Leandro Orellana &#8212; Software Developer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="boot-screen" aria-label="BIOS Kalos Systems" data-i18n-aria="bios.aria">
    <div class="boot-sun" aria-hidden="true"></div>
    <div class="boot-shell">
      <div class="boot-titlebar">
        <span data-i18n="bios.titlebar">Kalos Systems // BIOS Setup</span>
        <span class="boot-leds" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="boot-content">
        <h1 class="boot-wordmark">KALOS<span> SYSTEMS</span></h1>
        <p class="boot-tagline" data-i18n="bios.tagline">Personal BIOS · Synthwave 84</p>
        <div class="boot-intro">
          <p class="bios-status"><span data-i18n="bios.status">System status:</span> <strong data-i18n="bios.poweredOff">Powered off</strong></p>
          <label class="language-picker">
            <span data-i18n="bios.languageLabel">Language</span>
            <select class="language-select" aria-label="Language" data-i18n-aria="bios.languageLabel">
              <option value="en">English</option>
              <option value="es">Español</option>
            </select>
          </label>
          <button class="boot-start" type="button" data-i18n="bios.start">▶ Start system</button>
          <p class="boot-error" role="alert" hidden></p>
          <button class="boot-fallback" type="button" data-i18n="bios.continueWithoutAudio" hidden>Continue without audio</button>
        </div>
        <div class="boot-running" hidden>
          <ul class="boot-log" aria-live="polite" aria-label="System startup messages" data-i18n-aria="bios.startupMessages"></ul>
          <div class="boot-progress-meta">
            <span class="boot-status-group">
              <span id="boot-status" aria-live="polite" data-i18n="bios.preparing">Preparing startup</span>
              <span class="boot-loader" aria-hidden="true" hidden>_/\_/\_</span>
            </span>
            <span id="boot-percentage">00%</span>
          </div>
          <div class="boot-progress" role="progressbar" aria-label="KalOS startup progress" data-i18n-aria="bios.progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="boot-progress-fill"></div>
          </div>
          <div class="boot-bottom">
            <span id="boot-stage" data-i18n="bios.stageReady">KALOS BIOS · READY</span>
            <div class="boot-bottom-actions">
              <button class="boot-skip" type="button" data-i18n="bios.skip">Skip startup ↵</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <audio class="boot-audio" preload="none" src="./audio/kalos_start.mp3"></audio>
    <noscript>
      <p class="boot-noscript">
        <span data-i18n="bios.noscript">JavaScript is disabled.</span>
        <a href="./login.html" data-i18n="bios.noscriptLink">Continue to login without animation</a>
      </p>
    </noscript>
  </main>
  <script src="./scripts/i18n.js" defer></script>
  <script src="./scripts/boot.js" defer></script>
</body>
</html>
