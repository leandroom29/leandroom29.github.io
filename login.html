<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10051f" />
  <meta name="description" content="Leandro Orellana's software development portfolio, focused on mobile apps, backend systems, and artificial intelligence." />
  <title>Leandro Orellana &#8212; Software Developer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<section class="login-screen" aria-label="Kalos Systems login" data-i18n-aria="login.aria">
    <div class="login-card">
      <img class="login-logo" src="./img/kalos_logo.png" alt="">
      <h1>KALOS SYSTEMS</h1>
      <p class="login-subtitle" data-i18n="login.subtitle">Desktop sign-in</p>
      <form class="login-form">
        <div class="login-field">
          <label for="login-user" data-i18n="login.username">Username</label>
          <input id="login-user" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label for="login-password" data-i18n="login.password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="login-actions">
          <button class="login-submit" type="submit" data-i18n="login.signIn">Sign in</button>
          <button class="login-demo" type="button" data-i18n="login.quickAccess">Quick access · fill and sign in</button>
        </div>
      </form>
      <p class="login-message" role="status" aria-live="polite"></p>
    </div>
  </section>
  <script src="./scripts/i18n.js" defer></script>
  <script src="./scripts/login.js" defer></script>
</body>
</html>
